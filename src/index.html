<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <title>OndeVai</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Organize despesas, rendimentos, orçamentos e objetivos de poupança com uma visão clara das suas finanças pessoais.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1b3f33">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any">
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon-16.png" sizes="16x16">
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <span class="boot-mark" aria-hidden="true"><svg viewBox="0 0 512 512" fill="none"><circle cx="256" cy="256" r="174"/><path d="M67 364c83-28 184-84 341-94-94 25-174 77-248 167"/></svg></span>
      <span class="boot-copy">A preparar a sua área financeira…</span>
    </div>
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 24px; background: #f7f3ea; color: #182d25; font: 500 15px/1.5 system-ui, sans-serif; text-align: center; opacity: 1; transition: opacity 180ms cubic-bezier(.23,1,.32,1); }
      #boot-splash.boot-splash-leaving { opacity: 0; }
      .boot-mark { width: 50px; height: 50px; display: grid; place-items: center; border: 1px solid #a7b59f; border-radius: 17px; background: #1b3f33; color: #f7f3ea; }
      .boot-mark svg { width: 36px; height: 36px; }
      .boot-mark circle { stroke: currentColor; stroke-width: 34; stroke-dasharray: 930 165; transform-origin: 256px 256px; animation: boot-orbit 1.6s linear infinite; }
      .boot-mark path { fill: currentColor; }
      .boot-copy { color: #4b5e53; }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark circle { animation-duration: 4s; } #boot-splash { transition-duration: 180ms; } }
    </style>
    <app-root></app-root>
    <noscript>O OndeVai precisa de JavaScript para guardar e analisar as suas despesas neste dispositivo.</noscript>
  </body>
</html>
